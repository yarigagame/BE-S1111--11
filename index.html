<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەخشی ڕاستەوخۆ - لایڤ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b131a;
            color: #fff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player-container {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- لەبری ئەم لینکەی خوارەوە، لینکی لایڤەکەی خۆت یان سێرڤەرەکەت دادەنێیت -->

    </div>

</body>
</html>
