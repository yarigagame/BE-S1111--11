<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەخشی ڕاستەوخۆ - یاریگا گەیم</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b131a;
            color: #fff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .player-container {
            width: 95%;
            max-width: 400px;
            aspect-ratio: 4/5;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .servers-box {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .server-btn {
            background-color: #1da1f2;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .server-btn:hover {
            background-color: #0d85d8;
        }
        .footer-text {
            margin-top: 15px;
            font-size: 13px;
            color: #8a9ba8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- پلەیری سەرەکی -->
        <iframe id="livePlayer" src="https://pl.matchlivehd.com/albaplayer/bein3/?serv=0" allowfullscreen></iframe>
    </div>

    <!-- دووگمەکانی گۆڕینی سێرڤەر -->
    <div class="servers-box">
        <button class="server-btn" onclick="changeServer('https://pl.matchlivehd.com/albaplayer/bein3/?serv=0')">سێرڤەر ١</button>
        <button class="server-btn" onclick="changeServer('https://pl.matchlivehd.com/albaplayer/bein3/?serv=1')">سێرڤەر ٢</button>
    </div>

    <!-- نوسینی خوارەوە -->
    <div class="footer-text">
        website: yarigagame.blogspot.com
    </div>

    <script>
        function changeServer(serverUrl) {
            document.getElementById('livePlayer').src = serverUrl;
        }
    </script>

</body>
</html>
